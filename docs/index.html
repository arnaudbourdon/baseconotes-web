<!doctype html>
<html lang="fr" data-version="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:">
<meta name="robots" content="noindex, nofollow">
<title>BaseCoNotes</title>
<style>
:root { --h: 328; --s: 82%; --fond: #f6f4f5; --carte: #ffffff; --texte: #1f1a1d; --doux: #6b6168; --bord: #e6dfe3; --accent: hsl(var(--h) var(--s) 44%); --accent-doux: hsl(var(--h) 70% 94%); --code: #f3eff1; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --fond: #17141a; --carte: #211d24; --texte: #ece6ea; --doux: #a59ca3; --bord: #352f38; --accent: hsl(var(--h) var(--s) 68%); --accent-doux: hsl(var(--h) 30% 22%); --code: #2a252d; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fond); color: var(--texte); font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
header { background: var(--accent); color: #fff; display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; }
@media (prefers-color-scheme: dark) { header { background: hsl(var(--h) 45% 30%); } }
header h1 { font-size: 17px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .meta { font-size: 12px; opacity: .85; }
header input { margin-left: auto; min-width: 0; width: 280px; max-width: 100%; border: 0; border-radius: 16px; padding: 6px 14px; font: inherit; font-size: 14px; background: rgba(255,255,255,.92); color: #222; }
#menu { display: none; background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 6px; padding: 2px 10px; font: inherit; cursor: pointer; }
main { flex: 1; display: flex; min-height: 0; }
nav { width: 320px; flex-shrink: 0; overflow: auto; padding: 12px 8px 24px; border-right: 1px solid var(--bord); background: var(--carte); }
nav ul { list-style: none; margin: 0; padding-left: 14px; }
nav > ul { padding-left: 0; }
nav details > summary { cursor: pointer; padding: 2px 6px; border-radius: 6px; font-weight: 600; list-style: none; }
nav details > summary::-webkit-details-marker { display: none; }
nav details > summary::before { content: "▸"; display: inline-block; width: 14px; color: var(--doux); transition: transform .15s; }
nav details[open] > summary::before { transform: rotate(90deg); }
nav a { display: block; padding: 2px 6px 2px 20px; border-radius: 6px; color: var(--texte); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav a:hover, nav summary:hover { background: var(--accent-doux); }
nav a.actif { background: var(--accent-doux); color: var(--accent); font-weight: 600; }
article { flex: 1; overflow: auto; padding: 28px clamp(16px, 5vw, 64px) 64px; }
article .page { max-width: 900px; margin: 0 auto; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 24px clamp(16px, 4vw, 40px); }
.chemin { font-size: 12px; color: var(--doux); margin-bottom: 4px; }
.page h1.titre { margin: 0 0 4px; font-size: 26px; }
.etiquette { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 10px; background: var(--accent-doux); color: var(--accent); margin-bottom: 12px; }
.prose a { color: var(--accent); }
.prose img { max-width: 100%; }
.prose table { border-collapse: collapse; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--bord); padding: 4px 10px; }
.prose pre { background: var(--code); padding: 10px 14px; border-radius: 8px; overflow-x: auto; }
.prose code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.prose pre code { background: none; padding: 0; }
.prose blockquote { margin: 0; padding: 4px 14px; border-left: 3px solid var(--accent); background: var(--accent-doux); border-radius: 0 8px 8px 0; }
.liste a { display: block; padding: 8px 10px; border-bottom: 1px solid var(--bord); color: var(--texte); text-decoration: none; }
.liste a:hover { background: var(--accent-doux); }
.liste small { display: block; color: var(--doux); }
.message { max-width: 560px; margin: 12vh auto; text-align: center; color: var(--doux); }
.message strong { color: var(--texte); display: block; font-size: 18px; margin-bottom: 8px; }
mark { background: hsl(var(--h) 90% 85%); color: inherit; border-radius: 3px; }
@media (max-width: 760px) {
  #menu { display: inline-block; }
  nav { position: fixed; top: 0; bottom: 0; left: 0; z-index: 5; width: 86vw; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.25); }
  body.menu nav { transform: none; }
  header input { width: 100%; margin-left: 0; }
  article { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="Arborescence">☰</button>
  <h1 id="nom">BaseCoNotes</h1>
  <span class="meta" id="meta">Lecture seule</span>
  <input id="recherche" type="search" placeholder="Rechercher" aria-label="Rechercher" disabled>
</header>
<main>
  <nav id="arbre" aria-label="Arborescence"></nav>
  <article id="contenu"><div class="message"><strong>Ouverture…</strong>Déchiffrement de la bibliothèque dans ton navigateur.</div></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(function () {
  'use strict';
  var base = null, cleLien = '', parChemin = {}, parTitre = {};
  var $ = function (id) { return document.getElementById(id); };
  var echapper = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var message = function (titre, texte) { $('contenu').innerHTML = '<div class="message"><strong>' + echapper(titre) + '</strong>' + echapper(texte) + '</div>'; };
  var octets = function (b64) { b64 = b64.replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '='; var s = atob(b64), o = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; };
  var lienVers = function (chemin) { return '#' + cleLien + (chemin ? '~' + encodeURIComponent(chemin) : ''); };
  var dateFr = function (iso) { try { return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } };

  function lireFragment() {
    var h = decodeURIComponent(location.hash.slice(1));
    var i = h.indexOf('~');
    return { cle: i < 0 ? h : h.slice(0, i), chemin: i < 0 ? '' : h.slice(i + 1) };
  }

  async function ouvrir() {
    var f = lireFragment();
    var m = /^([0-9a-f]{24})\.([A-Za-z0-9_-]{43})$/.exec(f.cle);
    if (!m) return message('Lien incomplet', 'Ce lien ne contient pas la clé de la bibliothèque. Demande le lien complet à un admin de BaseCoNotes.');
    cleLien = f.cle;
    var r = await fetch('b/' + m[1] + '.bin', { cache: 'no-cache' });
    if (!r.ok) return message('Bibliothèque introuvable', 'Elle a peut-être été retirée de la version web, ou le lien est ancien.');
    var donnees = new Uint8Array(await r.arrayBuffer());
    var cle = await crypto.subtle.importKey('raw', octets(m[2]), 'AES-GCM', false, ['decrypt']);
    var clair;
    try { clair = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: donnees.slice(0, 12) }, cle, donnees.slice(12)); }
    catch (e) { return message('Clé refusée', 'La clé de ce lien ne correspond plus : un admin l’a peut-être changée. Demande le nouveau lien.'); }
    var flux = new Blob([clair]).stream().pipeThrough(new DecompressionStream('gzip'));
    base = JSON.parse(await new Response(flux).text());
    base.contenus.forEach(function (c) { parChemin[c.chemin] = c; parTitre[c.titre.toLowerCase()] = c; });
    document.title = base.nom + ' · BaseCoNotes';
    $('nom').textContent = base.nom;
    $('meta').textContent = 'Lecture seule · publiée le ' + dateFr(base.publie) + ' · ' + base.contenus.length + ' Contenus';
    $('recherche').disabled = false;
    dessinerArbre();
    router();
  }

  function dessinerArbre() {
    var branche = function (noeuds, profondeur) {
      return '<ul>' + noeuds.map(function (n) {
        if (n.genre === 'texte') return '<li><a href="' + lienVers(n.chemin) + '" data-chemin="' + echapper(n.chemin) + '" title="' + echapper(n.titre) + '">' + echapper(n.titre) + '</a></li>';
        return '<li><details' + (profondeur < 1 ? ' open' : '') + ' data-chemin="' + echapper(n.chemin) + '"><summary>' + echapper(n.titre) + '</summary>' + branche(n.enfants, profondeur + 1) + '</details></li>';
      }).join('') + '</ul>';
    };
    $('arbre').innerHTML = branche(base.arbre, 0);
  }

  function trouverNiveau(noeuds, chemin) {
    for (var i = 0; i < noeuds.length; i++) {
      var n = noeuds[i];
      if (n.chemin === chemin) return n;
      if (n.genre !== 'texte') { var t = trouverNiveau(n.enfants, chemin); if (t) return t; }
    }
    return null;
  }

  function filAriane(chemin) {
    var parties = chemin.split('/');
    return parties.slice(1, -1).map(echapper).join(' › ');
  }

  function rendreMarkdown(md) {
    md = md.replace(/\/_medias\/([0-9a-f]{32}\.(?:png|jpg|gif|webp))/g, function (t, nom) { return base.images[nom] || t; });
    md = md.replace(/\[\[([^\]\n]+)\]\]/g, function (t, titre) {
      var c = parTitre[titre.trim().toLowerCase()];
      return c ? '[' + titre + '](' + lienVers(c.chemin) + ')' : titre;
    });
    var html = DOMPurify.sanitize(marked.parse(md, { gfm: true, breaks: false }), { ADD_ATTR: ['target'] });
    return html;
  }

  function afficherContenu(c) {
    var etiquette = c.type || '';
    $('contenu').innerHTML = '<div class="page"><div class="chemin">' + filAriane(c.chemin) + '</div><h1 class="titre">' + echapper(c.titre) + '</h1>' +
      (etiquette ? '<span class="etiquette">' + echapper(etiquette) + '</span>' : '') + '<div class="prose">' + rendreMarkdown(c.corps) + '</div></div>';
    $('contenu').scrollTop = 0;
    dessinerSchemas();
    document.querySelectorAll('.prose a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  }

  function afficherNiveau(n) {
    var feuilles = [];
    (function tout(l) { l.forEach(function (x) { if (x.genre === 'texte') feuilles.push(x); else tout(x.enfants); }); })(n.enfants);
    $('contenu').innerHTML = '<div class="page"><div class="chemin">' + filAriane(n.chemin + '/x') + '</div><h1 class="titre">' + echapper(n.titre) + '</h1><span class="etiquette">' + feuilles.length + ' Contenus</span><div class="liste">' +
      feuilles.map(function (f) { return '<a href="' + lienVers(f.chemin) + '">' + echapper(f.titre) + '<small>' + filAriane(f.chemin) + '</small></a>'; }).join('') + '</div></div>';
  }

  function accueil() {
    var recents = base.contenus.slice().sort(function (a, b) { return (b.modifie || '').localeCompare(a.modifie || ''); }).slice(0, 15);
    $('contenu').innerHTML = '<div class="page"><h1 class="titre">' + echapper(base.nom) + '</h1><span class="etiquette">Version web en lecture seule</span>' +
      '<p>Choisis un Contenu dans l’arborescence ou cherche un mot. Cette copie a été publiée le ' + dateFr(base.publie) + ' par ' + echapper(base.par) + ' ; la version à jour est dans l’application BaseCoNotes.</p><h3>Derniers Contenus modifiés</h3><div class="liste">' +
      recents.map(function (f) { return '<a href="' + lienVers(f.chemin) + '">' + echapper(f.titre) + '<small>' + filAriane(f.chemin) + (f.modifie ? ' · ' + dateFr(f.modifie) : '') + '</small></a>'; }).join('') + '</div></div>';
  }

  function router() {
    if (!base) return;
    var chemin = lireFragment().chemin;
    document.body.classList.remove('menu');
    document.querySelectorAll('nav a.actif').forEach(function (a) { a.classList.remove('actif'); });
    if (!chemin) return accueil();
    var c = parChemin[chemin];
    if (c) {
      var a = document.querySelector('nav a[data-chemin="' + CSS.escape(chemin) + '"]');
      if (a) { a.classList.add('actif'); for (var d = a.closest('details'); d; d = d.parentElement.closest('details')) d.open = true; a.scrollIntoView({ block: 'nearest' }); }
      return afficherContenu(c);
    }
    var n = trouverNiveau(base.arbre, chemin);
    if (n) return afficherNiveau(n);
    message('Contenu introuvable', 'Il a peut-être été déplacé depuis la publication.');
  }

  function chercher(texte) {
    var termes = texte.toLowerCase().split(/[\s,]+/).filter(Boolean);
    if (!termes.length) return router();
    var res = base.contenus.map(function (c) {
      var t = c.titre.toLowerCase(), corps = c.corps.toLowerCase(), score = 0;
      termes.forEach(function (m) { if (t.indexOf(m) >= 0) score += 5; if (corps.indexOf(m) >= 0) score += 1; });
      return { c: c, score: score };
    }).filter(function (x) { return x.score > 0; }).sort(function (a, b) { return b.score - a.score; }).slice(0, 60);
    var extrait = function (c) {
      var corps = c.corps.replace(/[#*_`>|\[\]]/g, ' ').replace(/\s+/g, ' ');
      var i = corps.toLowerCase().indexOf(termes[0]);
      var s = echapper(corps.slice(Math.max(0, i - 60), i + 140));
      termes.forEach(function (m) { s = s.replace(new RegExp('(' + m.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); });
      return s;
    };
    $('contenu').innerHTML = '<div class="page"><h1 class="titre">Recherche</h1><span class="etiquette">' + res.length + ' résultat' + (res.length > 1 ? 's' : '') + '</span><div class="liste">' +
      res.map(function (x) { return '<a href="' + lienVers(x.c.chemin) + '">' + echapper(x.c.titre) + '<small>' + extrait(x.c) + '</small></a>'; }).join('') + '</div></div>';
  }

  var mermaidCharge = null;
  function dessinerSchemas() {
    var blocs = document.querySelectorAll('.prose pre code.language-mermaid');
    if (!blocs.length) return;
    mermaidCharge = mermaidCharge || new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
    mermaidCharge.then(function () {
      window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
      blocs.forEach(function (code) { var d = document.createElement('div'); d.className = 'mermaid'; d.textContent = code.textContent; code.parentElement.replaceWith(d); });
      window.mermaid.run({ querySelector: '.prose .mermaid' });
    }).catch(function () {});
  }

  window.addEventListener('hashchange', function () { if (lireFragment().cle !== cleLien) { location.reload(); return; } $('recherche').value = ''; router(); });
  var minuterie = 0;
  $('recherche').addEventListener('input', function (e) { clearTimeout(minuterie); minuterie = setTimeout(function () { chercher(e.target.value); }, 200); });
  $('menu').addEventListener('click', function () { document.body.classList.toggle('menu'); });
  ouvrir().catch(function (e) { message('Ouverture impossible', String(e && e.message || e)); });
})();
</script>
</body>
</html>
